[package]
license = "Apache-2.0"
name = "xai-grok-operator-ui"
version = "0.1.0"
edition.workspace = true
description = "Optional compact egui operator client for grokd"

[dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "time"] }
xai-grok-control-client = { workspace = true }
xai-grok-protocol = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow", "x11"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts", "glow"] }

[[bin]]
name = "grok-ui"
path = "src/main.rs"

[lints]
workspace = true
